<!doctype html><meta charset=utf-8><title>imgtest</title>
<pre id="log"></pre>
<script>
var log=document.getElementById('log');
function L(s){log.textContent+=s+"\n";}
var GOOD='data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==';
var img=document.createElement('img');
document.body.appendChild(img);
img.addEventListener('load',function(){L('EVENT load  src='+(img.getAttribute('src')||'(none)'));});
img.addEventListener('error',function(){L('EVENT error src='+(img.getAttribute('src')||'(none)'));});

// TEST 1: load a good image, then removeAttribute('src'). Does error fire?
img.src=GOOD;
setTimeout(function(){
  L('--- calling removeAttribute(src) on a loaded img ---');
  img.removeAttribute('src');
  setTimeout(function(){
    L('--- test1 done (any EVENT error above = removeAttribute fires error) ---');
    // TEST 2: set src="" instead
    img.src=GOOD;
    setTimeout(function(){
      L('--- calling img.src = "" ---');
      img.src='';
      setTimeout(function(){ L('--- test2 done ---'); window.__done=true; },400);
    },300);
  },400);
},300);
</script>
